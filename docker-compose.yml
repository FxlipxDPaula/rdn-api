services:
  postgres:
    image: postgres:16-alpine
    container_name: rdn-postgres
    environment:
      POSTGRES_DB: rdn
      POSTGRES_USER: rdn
      POSTGRES_PASSWORD: rdn
    ports:
      - "5432:5432"
    volumes:
      - rdn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdn -d rdn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servico opcional da API (imagem multi-stage). Fica atras do profile "full" para nao
  # conflitar com quem roda a aplicacao pelo wrapper:
  #   docker compose up -d                     -> so o PostgreSQL
  #   docker compose --profile full up -d --build  -> PostgreSQL + API em http://localhost:8080
  api:
    profiles: ["full"]
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rdn
      DB_USER: rdn
      DB_PASSWORD: rdn
      JWT_SECRET: rdn-api-dev-secret-key-change-me-32b
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rdn-pgdata:

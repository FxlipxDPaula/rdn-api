services:
  postgres:
    image: postgres:16-alpine
    container_name: rdn-postgres
    environment:
      POSTGRES_DB: rdn
      POSTGRES_USER: rdn
      POSTGRES_PASSWORD: rdn
    ports:
      - "5432:5432"
    volumes:
      - rdn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdn -d rdn"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rdn-pgdata:

spring.application.name=rdn-api

# Porta HTTP: o Render (e a maioria dos PaaS) injeta a variavel PORT.
# Sem PORT definida, sobe em 8080 como no ambiente local.
server.port=${PORT:8080}
# Respeita X-Forwarded-* quando a aplicacao roda atras de proxy reverso (Render, ngrok, cloudflared).
server.forward-headers-strategy=framework

# Banco de dados: valores sobrescreviveis por variavel de ambiente.
# Ver .env.example e docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rdn}
spring.datasource.username=${DB_USER:rdn}
spring.datasource.password=${DB_PASSWORD:rdn}

# O schema e criado apenas pelo Flyway; o Hibernate somente valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (Etapa 2). O segredo padrao serve apenas para desenvolvimento local:
# em qualquer ambiente real defina JWT_SECRET com pelo menos 32 bytes.
security.jwt.secret=${JWT_SECRET:rdn-api-dev-secret-key-change-me-32b}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# OpenAPI/Swagger (Etapa 6). Os caminhos batem com as liberacoes do SecurityConfig.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# URL publica usada no campo "servers" do OpenAPI (botao Try it out).
# Vazio = mesma origem que abriu o Swagger UI, o que funciona em local e em deploy.
app.public-url=${APP_PUBLIC_URL:}

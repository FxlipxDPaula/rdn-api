# Este arquivo substitui o application.properties de src/main no classpath de
# testes (test resources tem precedencia). Objetivo: rodar sem PostgreSQL local
# e sem Docker, que nao estao disponiveis na maquina de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:rdn;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema de teste vem do mapeamento JPA. A validade do DDL do Flyway e
# verificada por SchemaDdlTest, que executa V1__schema.sql, V2__seed.sql e
# V3__seed_users.sql.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

# Mesmo segredo de desenvolvimento do application.properties principal
# (este arquivo o substitui no classpath de testes).
security.jwt.secret=test-secret-key-with-at-least-32-bytes!!
security.jwt.expiration-seconds=3600
